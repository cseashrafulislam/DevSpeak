<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101c31">
  <meta name="description" content="Learn English and AI Engineering with C#, ASP.NET and SQL Server. English speaking practice, 180-day English roadmap, plus 180 AI tutorials and practical ERP projects.">
  <title>DevSpeak — English for Global .NET Careers</title>
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/assets/styles.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">D<span>S</span></span>
        <div><strong>DevSpeak</strong><small>English → Global .NET Job</small></div>
      </div>
      <div class="sidebar-label">YOUR LEARNING SPACE</div>
      <nav id="nav" class="side-nav" aria-label="Learning modules"></nav>
      <div class="sidebar-bottom">
        <div class="mini-goal"><span class="mini-goal-icon">✦</span><div><strong>Learn from zero.</strong><small>Speak like an engineer.</small></div></div>
        <p>100% free • No login • Browser-based</p>
      </div>
    </aside>
    <div id="mobileOverlay" class="mobile-overlay" hidden></div>
    <div class="workspace">
      <header class="topbar">
        <div class="top-left">
          <button id="menuToggle" class="icon-button mobile-menu" type="button" aria-label="Open navigation" aria-expanded="false">☰</button>
          <div><div class="top-eyebrow">YOUR PERSONAL LEARNING WORKSPACE</div><strong id="pageHeading">Dashboard</strong></div>
        </div>
        <div class="top-actions">
          <span class="top-badge" id="dayBadge">DAY 01 / 180</span>
          <span class="streak-badge" id="streakBadge">🔥 0</span>
          <button id="accentToggle" class="subtle-button" type="button" title="Change audio accent">🔊 US</button>
        </div>
      </header>
      <main id="main" tabindex="-1"><div id="app" aria-live="polite"></div></main>
      <footer class="footer">DevSpeak Global · Learn at your own pace · Your progress stays in this browser</footer>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
